{# app/views/reading/mammogram-viewer.html #}
{# Standalone mammogram viewer page - receives updates via BroadcastChannel #}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mammogram viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .viewer-header {
      background-color: #0d0d0d;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    .viewer-header__row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      justify-content: space-between;
      align-items: center;
    }

    .viewer-header__name {
      font-size: 18px;
      font-weight: 600;
    }

    .viewer-header__details {
      font-size: 14px;
      color: #999;
    }

    .viewer-header__details span {
      margin-right: 16px;
    }

    .viewer-header__tools {
      display: flex;
      gap: 8px;
    }

    .viewer-header__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .viewer-button[hidden] {
      display: none;
    }

    .viewer-button {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
    }

    .viewer-button:hover {
      background-color: #444;
    }

    .viewer-button--small {
      padding: 4px 10px;
      font-size: 12px;
    }

    .viewer-button--quiet {
      background-color: transparent;
      border-color: #444;
      color: #999;
    }

    .viewer-button--quiet:hover {
      background-color: #333;
      color: #fff;
    }

    .viewer-layouts,
    .viewer-studies {
      display: flex;
      gap: 4px;
      margin-right: 16px;
    }

    .viewer-studies[hidden] {
      display: none;
    }

    .viewer-studies__none {
      align-self: center;
      color: #999;
      font-size: 14px;
    }

    .viewer-button[aria-pressed="true"] {
      background-color: #fff;
      border-color: #fff;
      color: #000;
      font-weight: 600;
    }

    .viewer-studies .viewer-button[aria-pressed="true"] {
      background-color: #444;
      border-color: #c9a227;
      color: #fff;
    }

    /* One grid per screen; in single screen mode both sit side by side */
    .viewer-screens {
      flex: 1;
      display: flex;
      gap: 4px;
      padding: 4px;
      min-height: 0;
    }

    .viewer-grid {
      flex: 1;
      display: grid;
      gap: 4px;
      min-width: 0;
      min-height: 0;
    }

    .viewer-panel {
      background-color: #000;
      border: 2px solid transparent;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* The border says which study a view is from */
    .viewer-panel--current {
      border-color: #2c5f8f;
    }

    .viewer-panel--prior {
      border-color: #c9a227;
    }

    .viewer-panel--right {
      justify-content: flex-end;
    }

    .viewer-panel--left {
      justify-content: flex-start;
    }

    .viewer-panel__label {
      position: absolute;
      top: 8px;
      left: 8px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      border-radius: 2px;
      z-index: 1;
    }

    .viewer-label__date {
      display: block;
      font-weight: 400;
      color: #ccc;
    }

    .viewer-panel__label--right {
      left: auto;
      right: 8px;
      text-align: right;
    }

    .viewer-panel__image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: zoom-in;
    }

    .viewer-panel__image[hidden] {
      display: none;
    }

    .viewer-panel__missing {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: #3a3a3a;
    }

    .viewer-panel__missing svg {
      width: 48px;
      height: 48px;
    }

    .viewer-placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #666;
      text-align: center;
      padding: 40px;
    }

    .viewer-placeholder__icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .viewer-placeholder__text {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .viewer-placeholder__hint {
      font-size: 14px;
      color: #555;
    }

    .viewer-status {
      background-color: #0d0d0d;
      padding: 8px 16px;
      font-size: 12px;
      color: #666;
      border-top: 1px solid #333;
      flex-shrink: 0;
    }

    .viewer-zoom {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.95);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }

    .viewer-zoom--zoomed {
      cursor: grab;
    }

    .viewer-zoom--panning {
      cursor: grabbing;
    }

    .viewer-zoom__image {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
      transform-origin: center center;
      user-select: none;
      -webkit-user-drag: none;
    }

    .viewer-zoom__level {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 4px 8px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: #aaa;
      border-radius: 4px;
      z-index: 1;
    }

    .viewer-zoom__label {
      position: absolute;
      top: 16px;
      left: 16px;
      background-color: rgba(0, 0, 0, 0.8);
      border: 2px solid #2c5f8f;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      border-radius: 4px;
      z-index: 1;
    }

    .viewer-zoom__label--prior {
      border-color: #c9a227;
    }

    .viewer-zoom__close {
      position: absolute;
      top: 16px;
      right: 16px;
      background-color: rgba(80, 80, 80, 0.9);
      color: #fff;
      border: 1px solid #777;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
      z-index: 1;
    }

    .viewer-zoom__close:hover {
      background-color: rgba(100, 100, 100, 1);
      border-color: #999;
    }

    .viewer-zoom__hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.7);
      padding: 8px 16px;
      font-size: 13px;
      color: #aaa;
      border-radius: 4px;
      z-index: 1;
    }

    .viewer-debug {
      position: fixed;
      bottom: 32px;
      left: 0;
      right: 0;
      background-color: rgba(50, 50, 0, 0.9);
      border-top: 1px solid #666;
      padding: 8px 16px;
      font-size: 13px;
      font-family: monospace;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .viewer-debug__label {
      color: #888;
    }

    .viewer-debug__id {
      color: #fff;
      font-weight: bold;
    }

    .viewer-debug__tag {
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      text-transform: uppercase;
    }

    .viewer-debug__tag--normal {
      background-color: #0a5;
      color: #fff;
    }

    .viewer-debug__tag--abnormal {
      background-color: #d00;
      color: #fff;
    }

    .viewer-debug__tag--technical {
      background-color: #c80;
      color: #000;
    }

    .viewer-debug__tag--indeterminate {
      background-color: #666;
      color: #fff;
    }

    .viewer-debug__description {
      color: #ccc;
      flex: 1;
    }

    .viewer-debug__context {
      color: #888;
      font-size: 11px;
      margin-left: auto;
    }

    .viewer-debug__context-flag {
      display: inline-block;
      padding: 2px 6px;
      margin-left: 4px;
      border-radius: 3px;
      background-color: #444;
      color: #fff;
    }

    .viewer-debug__context-flag--active {
      background-color: #06c;
    }

    /* Buttons to choose between a view's images, such as a repeat and the original */
    .viewer-panel__images {
      position: absolute;
      bottom: 8px;
      left: 8px;
      display: flex;
      gap: 4px;
      z-index: 1;
    }

    .viewer-panel__images--right {
      left: auto;
      right: 8px;
    }

    .viewer-panel__images .viewer-button {
      padding: 4px 10px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

  </style>
</head>
<body>
  <header class="viewer-header" id="viewer-header" style="display: none;">
    <div class="viewer-header__row">
      <div class="viewer-header__name" id="participant-name"></div>
      <div class="viewer-header__tools">
        <button class="viewer-button viewer-button--small viewer-button--quiet" id="switch-screens" type="button">
          {{ "Use two screens" if data.settings.reading.pacsScreens == "one" else "Use one screen" }}
        </button>
        <button class="viewer-button viewer-button--small viewer-button--quiet" id="close-viewer" type="button">
          Close viewer
        </button>
      </div>
    </div>
    <div class="viewer-header__row">
      <div class="viewer-header__details" id="participant-details"></div>
      <div class="viewer-header__actions">
        <div class="viewer-layouts" id="viewer-layouts" role="group" aria-label="Layout"></div>
        <div class="viewer-studies" id="viewer-studies" role="group" aria-label="Prior" hidden></div>
        <button class="viewer-button" id="open-other-screen" type="button" hidden>Open screen 2</button>
      </div>
    </div>
  </header>

  <div class="viewer-screens" id="viewer-screens" style="display: none;"></div>

  <div class="viewer-placeholder" id="viewer-placeholder">
    <div class="viewer-placeholder__icon">🔬</div>
    <div class="viewer-placeholder__text">Waiting for participant</div>
    <div class="viewer-placeholder__hint">Open a case in the reading workflow to view mammograms</div>
  </div>

  <div class="viewer-placeholder" id="viewer-loading" style="display: none;">
    <div class="viewer-placeholder__icon">⏳</div>
    <div class="viewer-placeholder__text">Loading next case...</div>
  </div>

  <footer class="viewer-status" id="viewer-status">
    Listening for updates...
  </footer>

  <div class="viewer-debug" id="viewer-debug" style="display: none;">
    <span class="viewer-debug__label">Set:</span>
    <span class="viewer-debug__id" id="debug-set-id"></span>
    <span class="viewer-debug__tag" id="debug-set-tag"></span>
    <span class="viewer-debug__description" id="debug-set-description"></span>
    <span class="viewer-debug__context" id="debug-context"></span>
  </div>

  <script>
    // Mammogram viewer - listens for BroadcastChannel messages
    const CHANNEL_NAME = "mammogram-viewer"
    const INSPECT_KEY = "reading-inspect-panel-open"

    // Units with two monitors get a window for each: screen 1 on the left,
    // screen 2 on the right. With one (landscape) monitor, one window shows
    // both screens side by side
    const SCREEN_MODE = "{{ 'one' if data.settings.reading.pacsScreens == 'one' else 'two' }}"
    const SCREEN = SCREEN_MODE === "two" && new URLSearchParams(window.location.search).get("screen") === "2" ? 2 : 1
    const SCREENS_IN_WINDOW = SCREEN_MODE === "one" ? [1, 2] : [SCREEN]
    const OTHER_SCREEN_URL = "/reading/mammogram-viewer?screen=2"
    const OTHER_SCREEN_WINDOW = "mammogram-viewer-2"
    // Layout, prior and images to restore after switching screen mode reloads the viewer
    const RESTORE_STATE_KEY = "mammogram-viewer-restore-state"

    const VIEW_LABELS = {
      rcc: "RCC",
      lcc: "LCC",
      rmlo: "RMLO",
      lmlo: "LMLO"
    }

    const panel = (study, view) => ({ study, view })

    // The hanging protocol: layouts the reader steps through with ← and →.
    // Each panel shows a view from the current study or from the prior being
    // compared. Right breast views sit on the left, as if facing the woman
    const LAYOUTS = [
      {
        name: "Priors",
        title: "Prior above current. MLOs on screen 1, CCs on screen 2",
        needsPriors: true,
        screens: {
          1: {
            columns: 2,
            panels: [panel("prior", "rmlo"), panel("prior", "lmlo"), panel("current", "rmlo"), panel("current", "lmlo")]
          },
          2: {
            columns: 2,
            panels: [panel("prior", "rcc"), panel("prior", "lcc"), panel("current", "rcc"), panel("current", "lcc")]
          }
        }
      },
      {
        name: "Current",
        title: "Right breast on screen 1, left on screen 2. CC above MLO",
        screens: {
          1: { columns: 1, panels: [panel("current", "rcc"), panel("current", "rmlo")] },
          2: { columns: 1, panels: [panel("current", "lcc"), panel("current", "lmlo")] }
        }
      },
      {
        name: "MLO",
        title: "RMLO on screen 1, LMLO on screen 2",
        screens: {
          1: { columns: 1, panels: [panel("current", "rmlo")] },
          2: { columns: 1, panels: [panel("current", "lmlo")] }
        }
      },
      {
        name: "CC",
        title: "RCC on screen 1, LCC on screen 2",
        screens: {
          1: { columns: 1, panels: [panel("current", "rcc")] },
          2: { columns: 1, panels: [panel("current", "lcc")] }
        }
      }
    ]

    let currentAppointmentId = null
    let channel = null

    // The last study received, so screen 1 can pass it to screen 2 when it opens
    let currentData = null

    // DOM elements
    const headerEl = document.getElementById("viewer-header")
    const screensEl = document.getElementById("viewer-screens")
    const placeholderEl = document.getElementById("viewer-placeholder")
    const loadingEl = document.getElementById("viewer-loading")
    const statusEl = document.getElementById("viewer-status")
    const nameEl = document.getElementById("participant-name")
    const detailsEl = document.getElementById("participant-details")
    const layoutsEl = document.getElementById("viewer-layouts")
    const studiesEl = document.getElementById("viewer-studies")
    const openOtherScreenEl = document.getElementById("open-other-screen")
    const closeViewerEl = document.getElementById("close-viewer")
    const switchScreensEl = document.getElementById("switch-screens")

    // Debug elements
    const debugEl = document.getElementById("viewer-debug")
    const debugSetIdEl = document.getElementById("debug-set-id")
    const debugSetTagEl = document.getElementById("debug-set-tag")
    const debugSetDescEl = document.getElementById("debug-set-description")
    const debugContextEl = document.getElementById("debug-context")
    let debugVisible = false

    // Current set info for debug display
    let currentSetInfo = null

    // Any priors, oldest first, then the current study last
    let currentStudies = []

    // The prior the Priors layout compares with: the most recent by default
    let comparisonStudyIndex = -1

    // Which image shows for a view that has more than one (such as a repeat),
    // by "studyIndex:view". A view not listed shows its latest image
    let imageChoices = {}

    // Layouts this participant can have (Priors only when there are priors),
    // and which is showing
    let availableLayouts = []
    let layoutIndex = 0

    // Zoom limits and steps, relative to the image fitted to the screen
    const MIN_ZOOM = 1
    const MAX_ZOOM = 8
    const KEYBOARD_ZOOM_STEP = 1.25

    // Clicking an image opens it this many times the fitted size, centred on the point clicked
    const CLICK_ZOOM = 4

    // A pointer that moves further than this between press and release is a drag, not a click
    const CLICK_TOLERANCE = 5

    // Closes the open zoom view and removes its listeners
    let closeActiveZoom = null

    /**
     * Close the zoom overlay if open
     */
    const closeZoomOverlay = () => {
      if (closeActiveZoom) {
        closeActiveZoom()
      }
    }

    const isCurrentStudy = (index) => index === currentStudies.length - 1

    /**
     * The full-resolution path for a displayed image, if its study has one
     * @param {string} src - The image's src (absolute or relative)
     * @param {object} study - The study it's from
     * @returns {string|null}
     */
    const getFullSrc = (src, study) => {
      if (!study?.fullPaths || !src) return null
      return study.fullPaths[new URL(src, window.location.href).pathname] || null
    }

    /**
     * Every image of a view in a study, oldest first, so the last is the latest
     * @param {number} studyIndex - Index in currentStudies
     * @param {string} view - "rcc", "lcc", "rmlo" or "lmlo"
     * @returns {Array<string>}
     */
    const getViewPaths = (studyIndex, view) => {
      const study = currentStudies[studyIndex]
      const allPaths = study?.allPaths?.[view]
      if (Array.isArray(allPaths) && allPaths.length > 1) return allPaths
      const path = study?.images?.[view]
      return path ? [path] : []
    }

    /**
     * Which of a view's images is showing: the one chosen, or the latest
     * @returns {number} Index in getViewPaths
     */
    const getImageChoice = (studyIndex, view) => {
      const paths = getViewPaths(studyIndex, view)
      const choice = imageChoices[`${studyIndex}:${view}`]
      return choice >= 0 && choice < paths.length ? choice : paths.length - 1
    }

    /**
     * Label for an image: the view (and which image, when the view has more
     * than one), then the study's date. Current and prior are labelled alike;
     * the panel border tells them apart
     * @param {string} view - "rcc", "lcc", "rmlo" or "lmlo"
     * @param {number} studyIndex - Index in currentStudies
     * @returns {object} view, and date (empty when not known)
     */
    const getImageLabel = (view, studyIndex) => {
      const study = currentStudies[studyIndex]
      const imageCount = getViewPaths(studyIndex, view).length
      const imageText = imageCount > 1 ? ` (${getImageChoice(studyIndex, view) + 1} of ${imageCount})` : ""
      return {
        view: `${VIEW_LABELS[view]}${imageText}`,
        date: study?.dateText || ""
      }
    }

    /**
     * Put an image label in an element: the view, with the date on its own line
     */
    const renderLabel = (labelEl, label) => {
      labelEl.textContent = label.view
      if (!label.date) return
      const dateEl = document.createElement("span")
      dateEl.className = "viewer-label__date"
      dateEl.textContent = label.date
      labelEl.appendChild(dateEl)
    }

    /**
     * Image label as one line of text, for alt text. Says "prior", since the
     * border colour can't
     */
    const getImageAltText = (label, isPrior) => {
      return [label.view, isPrior ? "prior" : "", label.date].filter(Boolean).join(", ")
    }

    /**
     * Set debug info visibility, optionally broadcasting the change
     * @param {boolean} open - Whether to show or hide
     * @param {boolean} broadcast - Whether to notify the reading page
     */
    const setDebugState = (open, broadcast) => {
      debugVisible = open
      debugEl.style.display = open ? "flex" : "none"
      if (open && currentSetInfo) {
        updateDebugInfo(currentSetInfo)
      }
      sessionStorage.setItem(INSPECT_KEY, open ? "true" : "false")
      if (broadcast && channel) {
        channel.postMessage({ type: "inspect-toggle", open: open, timestamp: Date.now() })
      }
    }

    /**
     * Toggle debug info visibility (press 'i' to inspect)
     */
    const toggleDebug = () => {
      setDebugState(!debugVisible, true)
    }

    /**
     * Update the debug info display
     */
    const updateDebugInfo = (data) => {
      currentSetInfo = data
      if (!debugVisible) return

      debugSetIdEl.textContent = data.setId || "unknown"
      debugSetDescEl.textContent = data.setDescription || ""

      // Update tag with color coding
      const tag = data.setTag || "unknown"
      debugSetTagEl.textContent = tag
      debugSetTagEl.className = `viewer-debug__tag viewer-debug__tag--${tag}`

      // Update context flags
      const context = data.context || {}
      const flags = []
      if (context.hasSymptoms) {
        const sides = context.symptomSides?.length > 0 ? ` (${context.symptomSides.join(", ")})` : ""
        flags.push(`<span class="viewer-debug__context-flag viewer-debug__context-flag--active">symptoms${sides}</span>`)
      }
      if (context.hasImplants) {
        flags.push(`<span class="viewer-debug__context-flag viewer-debug__context-flag--active">implants</span>`)
      }
      if (context.isImperfect) {
        flags.push(`<span class="viewer-debug__context-flag viewer-debug__context-flag--active">imperfect</span>`)
      }
      debugContextEl.innerHTML = flags.length > 0 ? flags.join("") : "<span style='color:#666'>no flags</span>"
    }

    // Listen for 'i' key to toggle debug (inspect mode)
    document.addEventListener("keydown", (e) => {
      if (e.key === "i" || e.key === "I") {
        toggleDebug()
      }
    })

    /**
     * Show the placeholder (no participant loaded)
     */
    const showPlaceholder = () => {
      // Close any open overlays
      closeZoomOverlay()

      headerEl.style.display = "none"
      screensEl.style.display = "none"
      placeholderEl.style.display = "flex"
      loadingEl.style.display = "none"
      currentAppointmentId = null
      currentData = null
      currentStudies = []
      comparisonStudyIndex = -1
      imageChoices = {}
      updateStatus("Waiting for participant...")
    }

    /**
     * Show loading state (navigating to next case)
     */
    const showLoading = () => {
      // Close any open overlays
      closeZoomOverlay()

      headerEl.style.display = "none"
      screensEl.style.display = "none"
      placeholderEl.style.display = "none"
      loadingEl.style.display = "flex"
      updateStatus("Loading...")
    }

    /**
     * Render participant details in single line
     */
    const renderDetails = (data) => {
      const details = []

      if (data.nhsNumber) {
        details.push(`NHS: ${data.nhsNumber}`)
      }
      if (data.sxNumber) {
        details.push(`SX: ${data.sxNumber}`)
      }
      if (data.dateOfBirth) {
        details.push(`DOB: ${data.dateOfBirth}`)
      }

      detailsEl.innerHTML = details.map(d => `<span>${d}</span>`).join('')
    }

    /**
     * Show mammograms for a participant, in the first layout: Priors if they
     * have any, otherwise Current
     */
    const showMammograms = (data) => {
      // Close any open overlays from previous case
      closeZoomOverlay()

      // Log set info to console for debugging
      console.log('%c[Mammogram Set]', 'color: #0f0; font-weight: bold', {
        id: data.setId,
        tag: data.setTag,
        description: data.setDescription,
        context: data.context,
        hasAdditionalImages: data.hasAdditionalImages
      })

      // Update header
      nameEl.textContent = data.participantName || "Unknown"
      renderDetails(data)

      currentStudies = [
        ...(data.priors || [])
          .map((prior) => ({
            label: prior.label,
            dateText: prior.dateText,
            images: prior.paths || {},
            allPaths: prior.allPaths,
            fullPaths: prior.fullPaths || null
          }))
          .reverse(),
        {
          label: "Current",
          dateText: data.studyDateText || null,
          images: data.images || {},
          allPaths: data.allPaths,
          fullPaths: data.fullPaths || null
        }
      ]
      comparisonStudyIndex = currentStudies.length - 2
      imageChoices = {}
      availableLayouts = LAYOUTS.filter((layout) => !layout.needsPriors || currentStudies.length > 1)
      layoutIndex = 0

      renderLayoutSwitcher()
      renderStudySwitcher()
      renderScreens()

      // Update debug info if visible
      updateDebugInfo(data)

      // Show viewer
      placeholderEl.style.display = "none"
      loadingEl.style.display = "none"
      headerEl.style.display = "flex"
      screensEl.style.display = "flex"

      currentAppointmentId = data.appointmentId
      currentData = data
      updateStatus(`Viewing: ${data.participantName}`)
    }

    /**
     * One button per layout, in the order ← and → step through them
     */
    const renderLayoutSwitcher = () => {
      layoutsEl.replaceChildren()
      availableLayouts.forEach((layout, index) => {
        const buttonEl = document.createElement("button")
        buttonEl.type = "button"
        buttonEl.className = "viewer-button"
        buttonEl.textContent = layout.name
        buttonEl.title = layout.title
        buttonEl.addEventListener("click", () => {
          setLayout(index)
          broadcastViewerState()
        })
        layoutsEl.appendChild(buttonEl)
      })
    }

    /**
     * Buttons to choose which prior the Priors layout compares with, or a
     * note when there are no priors
     */
    const renderStudySwitcher = () => {
      studiesEl.replaceChildren()
      studiesEl.hidden = false
      if (currentStudies.length < 2) {
        const noteEl = document.createElement("span")
        noteEl.className = "viewer-studies__none"
        noteEl.textContent = "No priors"
        studiesEl.appendChild(noteEl)
        return
      }
      // Newest prior first
      currentStudies.slice(0, -1).forEach((study, index) => {
        const buttonEl = document.createElement("button")
        buttonEl.type = "button"
        buttonEl.className = "viewer-button"
        buttonEl.dataset.studyIndex = index
        buttonEl.textContent = `Prior: ${study.label}`
        if (study.dateText) buttonEl.title = study.dateText
        buttonEl.addEventListener("click", () => {
          setComparisonStudy(index)
          broadcastViewerState()
        })
        studiesEl.prepend(buttonEl)
      })
    }

    /**
     * Mark the showing layout and compared prior as pressed. The prior
     * buttons only show in the Priors layout
     */
    const updateSwitchers = () => {
      const isPriorsLayout = Boolean(availableLayouts[layoutIndex]?.needsPriors)
      studiesEl.hidden = currentStudies.length > 1 && !isPriorsLayout
      Array.from(layoutsEl.children).forEach((buttonEl, index) => {
        buttonEl.setAttribute("aria-pressed", index === layoutIndex ? "true" : "false")
      })
      Array.from(studiesEl.querySelectorAll("button")).forEach((buttonEl) => {
        const isPressed = isPriorsLayout && Number(buttonEl.dataset.studyIndex) === comparisonStudyIndex
        buttonEl.setAttribute("aria-pressed", isPressed ? "true" : "false")
      })
    }

    /**
     * Which study a panel shows
     * @param {string} studyType - "prior" or "current"
     * @returns {number} Index in currentStudies
     */
    const getPanelStudyIndex = (studyType) => {
      return studyType === "prior" ? comparisonStudyIndex : currentStudies.length - 1
    }

    /**
     * An image in a panel, with what the zoom view needs to know about it
     */
    const getImageItem = (studyIndex, view) => {
      const study = currentStudies[studyIndex]
      const path = getViewPaths(studyIndex, view)[getImageChoice(studyIndex, view)]
      if (!path) return null
      const src = new URL(path, window.location.href).href
      return {
        src,
        fullSrc: getFullSrc(src, study),
        label: getImageLabel(view, studyIndex),
        isPrior: !isCurrentStudy(studyIndex),
        view,
        studyIndex
      }
    }

    /**
     * The panels this window shows in the current layout, screen 1 first
     */
    const getPanelsInWindow = () => {
      const layout = availableLayouts[layoutIndex]
      if (!layout) return []
      return SCREENS_IN_WINDOW.flatMap((screen) => layout.screens[screen].panels)
    }

    /**
     * The images this window shows, in panel order, for ← → in the zoom view
     */
    const getAllViewableImages = () => {
      return getPanelsInWindow()
        .map(({ study, view }) => getImageItem(getPanelStudyIndex(study), view))
        .filter(Boolean)
    }

    /**
     * Where a click fell on an image, as fractions of the picture's width and
     * height. With object-fit the picture can be smaller than its element
     * @returns {object} fractionX and fractionY, from 0 to 1
     */
    const getClickFraction = (imageEl, e) => {
      const rect = imageEl.getBoundingClientRect()
      const scale = Math.min(rect.width / imageEl.naturalWidth, rect.height / imageEl.naturalHeight)
      const width = imageEl.naturalWidth * scale
      const height = imageEl.naturalHeight * scale
      const left = rect.left + (rect.width - width) / 2
      const top = rect.top + (rect.height - height) / 2
      const clamp = (value) => Math.min(1, Math.max(0, value))
      return {
        fractionX: clamp((e.clientX - left) / width),
        fractionY: clamp((e.clientY - top) / height)
      }
    }

    /**
     * Numbered buttons to flick between a view's images, such as a repeat
     * and the image it replaced. Only for views with more than one
     * @returns {HTMLElement|null}
     */
    const createImageChoiceButtons = (studyIndex, view, isRight) => {
      const paths = getViewPaths(studyIndex, view)
      if (paths.length < 2) return null

      const choice = getImageChoice(studyIndex, view)
      const groupEl = document.createElement("div")
      groupEl.className = `viewer-panel__images${isRight ? "" : " viewer-panel__images--right"}`
      groupEl.setAttribute("role", "group")
      groupEl.setAttribute("aria-label", `${VIEW_LABELS[view]} images`)

      paths.forEach((path, index) => {
        const isLatest = index === paths.length - 1
        const buttonEl = document.createElement("button")
        buttonEl.type = "button"
        buttonEl.className = "viewer-button"
        buttonEl.textContent = isLatest ? `${index + 1} (latest)` : `${index + 1}`
        buttonEl.title = `Image ${index + 1} of ${paths.length}`
        buttonEl.setAttribute("aria-pressed", index === choice ? "true" : "false")
        buttonEl.dataset.imageChoice = `${studyIndex}:${view}:${index}`
        buttonEl.addEventListener("click", (e) => {
          e.stopPropagation()
          setImageChoice(studyIndex, view, index)
          broadcastViewerState()
          // The panels are redrawn, so put focus back on the new button
          screensEl.querySelector(`[data-image-choice="${studyIndex}:${view}:${index}"]`)?.focus()
        })
        groupEl.appendChild(buttonEl)
      })
      return groupEl
    }

    /**
     * A panel showing one view of one study, or "No image"
     */
    const createPanel = ({ study: studyType, view }) => {
      const studyIndex = getPanelStudyIndex(studyType)
      const isPrior = !isCurrentStudy(studyIndex)
      const isRight = view.startsWith("r")

      const panelEl = document.createElement("div")
      panelEl.className = `viewer-panel viewer-panel--${isRight ? "right" : "left"} viewer-panel--${isPrior ? "prior" : "current"}`

      const labelEl = document.createElement("span")
      labelEl.className = `viewer-panel__label${isRight ? "" : " viewer-panel__label--right"}`
      renderLabel(labelEl, getImageLabel(view, studyIndex))
      panelEl.appendChild(labelEl)

      const item = getImageItem(studyIndex, view)
      if (item) {
        const imageEl = document.createElement("img")
        imageEl.className = "viewer-panel__image"
        imageEl.alt = getImageAltText(item.label, isPrior)
        // Hidden until loaded, so a slow image doesn't flash the previous one
        imageEl.hidden = true
        imageEl.onload = () => {
          imageEl.hidden = false
        }
        imageEl.src = item.src
        imageEl.addEventListener("click", (e) => {
          e.stopPropagation()
          const images = getAllViewableImages()
          const index = images.findIndex((image) => image.studyIndex === studyIndex && image.view === view)
          showZoom({ images, index, clickPoint: getClickFraction(imageEl, e) })
        })
        panelEl.appendChild(imageEl)

        const imagesEl = createImageChoiceButtons(studyIndex, view, isRight)
        if (imagesEl) panelEl.appendChild(imagesEl)
      } else {
        // A PACS knows nothing of medical history, so a missing view (for
        // example after a mastectomy) just shows that there's no image
        const missingEl = document.createElement("div")
        missingEl.className = "viewer-panel__missing"
        missingEl.setAttribute("role", "img")
        missingEl.setAttribute("aria-label", "No image")
        missingEl.innerHTML = `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
          <circle cx="24" cy="24" r="20"></circle>
          <line x1="10" y1="38" x2="38" y2="10"></line>
        </svg>`
        panelEl.appendChild(missingEl)
      }

      return panelEl
    }

    /**
     * Draw this window's screens in the current layout
     */
    const renderScreens = () => {
      const layout = availableLayouts[layoutIndex]
      screensEl.replaceChildren()
      if (!layout) return

      for (const screen of SCREENS_IN_WINDOW) {
        const { columns, panels } = layout.screens[screen]
        const gridEl = document.createElement("div")
        gridEl.className = "viewer-grid"
        gridEl.style.gridTemplateColumns = `repeat(${columns}, minmax(0, 1fr))`
        gridEl.style.gridTemplateRows = `repeat(${Math.ceil(panels.length / columns)}, minmax(0, 1fr))`
        panels.forEach((item) => gridEl.appendChild(createPanel(item)))
        screensEl.appendChild(gridEl)
      }
      updateSwitchers()
    }

    /**
     * Show a layout
     * @param {number} index - Index in availableLayouts
     */
    const setLayout = (index) => {
      if (!availableLayouts[index]) return
      closeZoomOverlay()
      layoutIndex = index
      renderScreens()
    }

    /**
     * Compare with another prior, moving to the Priors layout to show it
     * @param {number} index - Index in currentStudies
     */
    const setComparisonStudy = (index) => {
      if (index < 0 || index >= currentStudies.length - 1) return
      closeZoomOverlay()
      comparisonStudyIndex = index
      const priorsIndex = availableLayouts.findIndex((layout) => layout.needsPriors)
      if (priorsIndex !== -1) layoutIndex = priorsIndex
      renderScreens()
    }

    /**
     * Show one of a view's images in place of the latest
     * @param {number} studyIndex - Index in currentStudies
     * @param {string} view - "rcc", "lcc", "rmlo" or "lmlo"
     * @param {number} index - Index in getViewPaths
     */
    const setImageChoice = (studyIndex, view, index) => {
      imageChoices[`${studyIndex}:${view}`] = index
      renderScreens()
    }

    /**
     * Tell the other screen which layout, prior and images are showing, so
     * the two screens move together
     */
    const broadcastViewerState = () => {
      if (SCREEN_MODE !== "two" || !channel || !currentAppointmentId) return
      channel.postMessage({
        type: "viewer-state",
        ...getViewerState(),
        timestamp: Date.now()
      })
    }

    const getViewerState = () => ({
      appointmentId: currentAppointmentId,
      layoutName: availableLayouts[layoutIndex]?.name,
      comparisonStudyIndex,
      imageChoices
    })

    /**
     * After switching screen mode, put back the layout, prior and images
     * that were showing before the viewer reloaded
     */
    const restoreViewerState = () => {
      const savedState = sessionStorage.getItem(RESTORE_STATE_KEY)
      if (!savedState) return
      sessionStorage.removeItem(RESTORE_STATE_KEY)
      applyViewerState(JSON.parse(savedState))
    }

    /**
     * Switch between one window showing both screens and a window per
     * screen. The link saves the setting, so the viewer reloads in the new
     * mode. Screen 2 is opened here, during the click, so the browser
     * allows the pop-up
     */
    const switchScreenMode = () => {
      if (SCREEN === 2) {
        channel.postMessage({ type: "switch-screen-mode", timestamp: Date.now() })
        return
      }
      const newMode = SCREEN_MODE === "one" ? "two" : "one"
      const left = window.screen.availLeft ?? 0
      const top = window.screen.availTop ?? 0
      const { availWidth, availHeight } = window.screen
      const width = newMode === "two" ? Math.floor(availWidth / 2) : availWidth

      if (currentAppointmentId) {
        sessionStorage.setItem(RESTORE_STATE_KEY, JSON.stringify(getViewerState()))
      }
      channel.postMessage({ type: "screen-mode", mode: newMode, timestamp: Date.now() })
      window.moveTo(left, top)
      window.resizeTo(width, availHeight)
      if (newMode === "two") {
        window.open(
          `${OTHER_SCREEN_URL}&settings[reading][pacsScreens]=two`,
          OTHER_SCREEN_WINDOW,
          `left=${left + width},top=${top},width=${width},height=${availHeight},resizable=yes`
        )
      }
      window.location.href = `/reading/mammogram-viewer?settings[reading][pacsScreens]=${newMode}&clearQuery=true`
    }

    /**
     * Match the layout, prior and images the other screen is showing
     */
    const applyViewerState = (state) => {
      if (!state || state.appointmentId !== currentAppointmentId) return
      const index = availableLayouts.findIndex((layout) => layout.name === state.layoutName)
      if (index === -1) return
      const newImageChoices = state.imageChoices || {}
      const isSameImages = JSON.stringify(newImageChoices) === JSON.stringify(imageChoices)
      if (index === layoutIndex && state.comparisonStudyIndex === comparisonStudyIndex && isSameImages) return
      if (index !== layoutIndex || state.comparisonStudyIndex !== comparisonStudyIndex) closeZoomOverlay()
      layoutIndex = index
      if (state.comparisonStudyIndex >= 0 && state.comparisonStudyIndex < currentStudies.length - 1) {
        comparisonStudyIndex = state.comparisonStudyIndex
      }
      imageChoices = { ...newImageChoices }
      renderScreens()
    }

    /**
     * Update status bar
     */
    const updateStatus = (text) => {
      const screenText = SCREEN_MODE === "two" ? `Screen ${SCREEN} of 2 · ` : ""
      statusEl.textContent = `${screenText}${text}`
    }

    /**
     * Open screen 2 to the right of this window, the same size. Browsers
     * allow it without a click only when pop-ups are allowed for the site
     * @returns {boolean} Whether it opened
     */
    const openOtherScreen = () => {
      const otherWindow = window.open(
        OTHER_SCREEN_URL,
        OTHER_SCREEN_WINDOW,
        `left=${window.screenX + window.outerWidth},top=${window.screenY},width=${window.outerWidth},height=${window.outerHeight},resizable=yes`
      )
      return Boolean(otherWindow)
    }

    /**
     * Handle incoming messages
     */
    const handleMessage = (event) => {
      const data = event.data

      if (data.type === "ping") {
        // Respond to ping with pong so parent knows we're open
        channel.postMessage({ type: "pong", screen: SCREEN, timestamp: Date.now() })
      } else if (data.type === "loading") {
        // Show loading state when navigating away from current case
        showLoading()
      } else if (data.type === "show") {
        // Ignore if same appointment already displayed
        if (data.appointmentId !== currentAppointmentId) {
          showMammograms(data)
          restoreViewerState()
          // Screen 2 ignores a study it already has, so make sure it matches
          // this screen's fresh layout
          if (SCREEN === 1 && !data.viewerState) broadcastViewerState()
        }
        // Screen 1 sends its layout along when screen 2 opens
        if (data.viewerState) applyViewerState(data.viewerState)
      } else if (data.type === "clear") {
        showPlaceholder()
      } else if (data.type === "inspect-toggle") {
        // Sync inspect state from reading page (don't re-broadcast)
        setDebugState(data.open, false)
      } else if (data.type === "viewer-state") {
        applyViewerState(data)
      } else if (data.type === "request-current" && data.screen === 2 && SCREEN === 1 && currentData) {
        // Screen 2 has just opened: give it the study and layout
        channel.postMessage({ ...currentData, type: "show", viewerState: getViewerState(), timestamp: Date.now() })
      } else if (data.type === "screen-ping" && SCREEN === 2) {
        channel.postMessage({ type: "screen-opened", screen: SCREEN, timestamp: Date.now() })
      } else if (data.type === "screen-opened" && data.screen === 2) {
        openOtherScreenEl.hidden = true
      } else if (data.type === "screen-closed" && data.screen === 2 && SCREEN === 1) {
        openOtherScreenEl.hidden = SCREEN_MODE !== "two"
      } else if (data.type === "switch-screen-mode" && SCREEN === 1) {
        switchScreenMode()
      } else if (data.type === "close-viewer" && (!data.screen || data.screen === SCREEN)) {
        window.close()
      }
    }

    /**
     * Show an image fullscreen, with zoom, pan and arrow key navigation.
     * Clicking an image opens it zoomed in, centred on the point clicked; clicking again
     * closes. Arrow keys move between this window's images, zoomed or not;
     * pan by dragging. [ and ] show the same view from an older or newer study
     * @param {object} options
     * @param {Array<object>} [options.images] - Images to move between, from getAllViewableImages
     * @param {number} [options.index] - Which of them to show first
     * @param {object} [options.clickPoint] - Where the image was clicked, to zoom in on
     */
    const showZoom = ({ images, index, clickPoint } = {}) => {
      closeZoomOverlay()

      const allImages = images
      let currentIndex = index
      if (!allImages?.[currentIndex]) return

      const zoomEl = document.createElement("div")
      zoomEl.className = "viewer-zoom"
      zoomEl.innerHTML = `
        <div class="viewer-zoom__label"></div>
        <button class="viewer-zoom__close" type="button">Close</button>
        <img class="viewer-zoom__image" alt="">
        <div class="viewer-zoom__level"></div>
        <div class="viewer-zoom__hint"></div>
      `
      const labelEl = zoomEl.querySelector(".viewer-zoom__label")
      const imageEl = zoomEl.querySelector(".viewer-zoom__image")
      const levelEl = zoomEl.querySelector(".viewer-zoom__level")
      const hintEl = zoomEl.querySelector(".viewer-zoom__hint")

      // Scale is relative to the fitted image; offsets move the image's centre
      let scale = 1
      let offsetX = 0
      let offsetY = 0
      let drag = null
      let pressPoint = null
      let pendingClickPoint = clickPoint || null
      let isClosed = false

      const applyTransform = () => {
        const isZoomed = scale > 1
        imageEl.style.transform = isZoomed ? `translate(${offsetX}px, ${offsetY}px) scale(${scale})` : ""
        zoomEl.classList.toggle("viewer-zoom--zoomed", isZoomed)
        levelEl.textContent = isZoomed ? `${Math.round(scale * 100)}%` : "Fit"

        const navHint = allImages.length > 1 ? " · ← → to navigate" : ""
        const studyHint = currentStudies.length > 1 && allImages[currentIndex]?.view ? " · [ ] for priors" : ""
        hintEl.textContent = isZoomed
          ? `Drag to pan · + − or scroll to zoom · 0 to fit${navHint}${studyHint} · Click or Escape to close`
          : `Scroll or + − to zoom${navHint}${studyHint} · Click or Escape to close`
      }

      // Zoomed in, any point of the image can be panned to the centre of the
      // screen, even at its edge. Fitted, it stays centred
      const clampOffsets = () => {
        if (scale === 1) {
          offsetX = 0
          offsetY = 0
          return
        }
        const maxX = (imageEl.offsetWidth * scale) / 2
        const maxY = (imageEl.offsetHeight * scale) / 2
        offsetX = Math.min(maxX, Math.max(-maxX, offsetX))
        offsetY = Math.min(maxY, Math.max(-maxY, offsetY))
      }

      // Size the image to fit the screen from its shape, not its pixel size, so
      // the display and full-resolution files fill the same box
      const fitImage = () => {
        const aspectRatio = imageEl.naturalWidth / imageEl.naturalHeight
        if (!aspectRatio) return
        let width = zoomEl.clientWidth * 0.95
        let height = width / aspectRatio
        if (height > zoomEl.clientHeight * 0.95) {
          height = zoomEl.clientHeight * 0.95
          width = height * aspectRatio
        }
        imageEl.style.width = `${width}px`
        imageEl.style.height = `${height}px`
      }

      // Zoom in with the point clicked in the panel at the centre of the screen
      const zoomToClickPoint = ({ fractionX, fractionY }) => {
        scale = CLICK_ZOOM
        offsetX = -(fractionX - 0.5) * imageEl.offsetWidth * scale
        offsetY = -(fractionY - 0.5) * imageEl.offsetHeight * scale
        loadFullImage()
      }

      // A prior may not be the same shape, so refit and keep it in bounds
      imageEl.addEventListener("load", () => {
        fitImage()
        if (pendingClickPoint) {
          zoomToClickPoint(pendingClickPoint)
          pendingClickPoint = null
        }
        clampOffsets()
        applyTransform()
      })

      // Swap in the full-resolution image, if there is one, the first time it's zoomed
      const loadFullImage = () => {
        const image = allImages[currentIndex]
        if (!image.fullSrc) return
        if (image.isFullLoaded) {
          if (imageEl.getAttribute("src") !== image.fullSrc) imageEl.src = image.fullSrc
          return
        }
        if (image.isFullLoading) return

        image.isFullLoading = true
        const loader = new Image()
        loader.onload = () => {
          image.isFullLoaded = true
          if (!isClosed && allImages[currentIndex] === image && scale > 1) {
            imageEl.src = image.fullSrc
          }
        }
        loader.src = image.fullSrc
      }

      /**
       * Zoom to a scale, keeping the point under the pointer (or the centre) still
       */
      const zoomTo = (newScale, pointX = zoomEl.clientWidth / 2, pointY = zoomEl.clientHeight / 2) => {
        newScale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, newScale))
        if (newScale < 1.01) newScale = MIN_ZOOM

        const fromCentreX = pointX - zoomEl.clientWidth / 2
        const fromCentreY = pointY - zoomEl.clientHeight / 2
        const ratio = newScale / scale
        offsetX = fromCentreX - ratio * (fromCentreX - offsetX)
        offsetY = fromCentreY - ratio * (fromCentreY - offsetY)
        scale = newScale

        clampOffsets()
        if (scale > 1) loadFullImage()
        applyTransform()
      }

      const setLabel = (image) => {
        renderLabel(labelEl, image.label)
        labelEl.classList.toggle("viewer-zoom__label--prior", Boolean(image.isPrior))
        imageEl.alt = getImageAltText(image.label, image.isPrior)
      }

      const showImage = () => {
        const image = allImages[currentIndex]
        scale = 1
        offsetX = 0
        offsetY = 0
        setLabel(image)
        imageEl.src = image.src
        applyTransform()
      }

      // Show the same view from an older or newer study, at the same zoom and
      // position, so the two can be compared. Skips studies without the view
      const stepStudy = (step) => {
        const image = allImages[currentIndex]
        if (!image.view) return
        for (let studyIndex = image.studyIndex + step; studyIndex >= 0 && studyIndex < currentStudies.length; studyIndex += step) {
          const item = getImageItem(studyIndex, image.view)
          if (item) {
            allImages[currentIndex] = item
            setLabel(item)
            imageEl.src = item.src
            if (scale > 1) loadFullImage()
            applyTransform()
            return
          }
        }
      }

      const closeZoom = () => {
        if (isClosed) return
        isClosed = true
        zoomEl.remove()
        document.removeEventListener("keydown", handleKeydown)
        window.removeEventListener("resize", handleResize)
        closeActiveZoom = null
      }

      const handleKeydown = (e) => {
        if (e.key === "Escape") {
          closeZoom()
        } else if (e.key === "ArrowLeft") {
          e.preventDefault()
          // Wrap to end if at start
          currentIndex = currentIndex === 0 ? allImages.length - 1 : currentIndex - 1
          showImage()
        } else if (e.key === "ArrowRight") {
          e.preventDefault()
          // Wrap to start if at end
          currentIndex = currentIndex === allImages.length - 1 ? 0 : currentIndex + 1
          showImage()
        } else if (e.ctrlKey || e.metaKey || e.altKey) {
          // Leave the browser's own zoom shortcuts alone
        } else if (e.key === "[") {
          e.preventDefault()
          stepStudy(-1)
        } else if (e.key === "]") {
          e.preventDefault()
          stepStudy(1)
        } else if (e.key === "+" || e.key === "=") {
          e.preventDefault()
          zoomTo(scale * KEYBOARD_ZOOM_STEP)
        } else if (e.key === "-" || e.key === "_") {
          e.preventDefault()
          zoomTo(scale / KEYBOARD_ZOOM_STEP)
        } else if (e.key === "0") {
          e.preventDefault()
          zoomTo(MIN_ZOOM)
        }
      }

      const handleResize = () => {
        fitImage()
        clampOffsets()
        applyTransform()
      }

      // Mouse wheel and trackpad zoom. Trackpad pinches arrive as ctrl + wheel with small steps
      zoomEl.addEventListener("wheel", (e) => {
        e.preventDefault()
        const deltaPixels = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY
        const sensitivity = e.ctrlKey ? 0.01 : 0.002
        zoomTo(scale * Math.exp(-deltaPixels * sensitivity), e.clientX, e.clientY)
      }, { passive: false })

      zoomEl.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 || e.target.closest(".viewer-zoom__close")) return
        pressPoint = { x: e.clientX, y: e.clientY }
        if (scale === 1) return
        drag = { startX: e.clientX, startY: e.clientY, offsetX, offsetY }
        zoomEl.setPointerCapture(e.pointerId)
        zoomEl.classList.add("viewer-zoom--panning")
      })

      zoomEl.addEventListener("pointermove", (e) => {
        if (!drag) return
        offsetX = drag.offsetX + e.clientX - drag.startX
        offsetY = drag.offsetY + e.clientY - drag.startY
        clampOffsets()
        applyTransform()
      })

      const endDrag = () => {
        drag = null
        zoomEl.classList.remove("viewer-zoom--panning")
      }
      zoomEl.addEventListener("pointerup", endDrag)
      zoomEl.addEventListener("pointercancel", endDrag)

      // A click closes, but the end of a drag to pan doesn't
      zoomEl.addEventListener("click", (e) => {
        e.stopPropagation()
        if (e.target.closest(".viewer-zoom__close")) {
          closeZoom()
          return
        }
        const isDrag = pressPoint && Math.hypot(e.clientX - pressPoint.x, e.clientY - pressPoint.y) > CLICK_TOLERANCE
        pressPoint = null
        if (!isDrag) closeZoom()
      })

      document.addEventListener("keydown", handleKeydown)
      window.addEventListener("resize", handleResize)
      closeActiveZoom = closeZoom

      document.body.appendChild(zoomEl)
      showImage()
    }

    /**
     * Keys for the grid: ← and → step through the layouts, [ and ] compare
     * with an older or newer prior. From another layout, [ and ] first go
     * back to the Priors layout. The zoom view handles its own keys
     */
    const setupGridKeys = () => {
      document.addEventListener("keydown", (e) => {
        if (document.querySelector(".viewer-zoom")) return
        if (e.ctrlKey || e.altKey || e.metaKey) return
        if (!currentAppointmentId) return

        if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
          e.preventDefault()
          const step = e.key === "ArrowLeft" ? -1 : 1
          const index = (layoutIndex + step + availableLayouts.length) % availableLayouts.length
          setLayout(index)
          broadcastViewerState()
        } else if ((e.key === "[" || e.key === "]") && currentStudies.length > 1) {
          e.preventDefault()
          const isPriorsLayout = Boolean(availableLayouts[layoutIndex]?.needsPriors)
          const step = isPriorsLayout ? (e.key === "[" ? -1 : 1) : 0
          setComparisonStudy(comparisonStudyIndex + step)
          broadcastViewerState()
        }
      })
    }

    /**
     * Screen 1 opens screen 2 if it isn't open already. If the browser blocks
     * the pop-up, a button in the header opens it instead
     */
    const setupOtherScreen = () => {
      if (SCREEN_MODE !== "two") return

      if (SCREEN === 2) {
        channel.postMessage({ type: "screen-opened", screen: SCREEN, timestamp: Date.now() })
        window.addEventListener("pagehide", () => {
          channel.postMessage({ type: "screen-closed", screen: SCREEN, timestamp: Date.now() })
        })
        return
      }

      openOtherScreenEl.addEventListener("click", () => {
        if (openOtherScreen()) openOtherScreenEl.hidden = true
      })

      let isOtherScreenOpen = false
      const handleOpened = (event) => {
        if (event.data.type === "screen-opened" && event.data.screen === 2) isOtherScreenOpen = true
      }
      channel.addEventListener("message", handleOpened)
      channel.postMessage({ type: "screen-ping", timestamp: Date.now() })
      setTimeout(() => {
        channel.removeEventListener("message", handleOpened)
        if (!isOtherScreenOpen && !openOtherScreen()) {
          openOtherScreenEl.hidden = false
        }
      }, 150)
    }

    /**
     * Initialise the viewer
     */
    const init = () => {
      if (typeof BroadcastChannel === "undefined") {
        updateStatus("Error: BroadcastChannel not supported in this browser")
        return
      }

      // A second screen left open after switching to one screen isn't needed
      if (SCREEN_MODE === "one" && new URLSearchParams(window.location.search).get("screen") === "2") {
        window.close()
      }

      channel = new BroadcastChannel(CHANNEL_NAME)
      channel.addEventListener("message", handleMessage)

      // A screen 2 left open from two-screen mode would otherwise keep
      // driving this window's layout
      if (SCREEN_MODE === "one") {
        channel.postMessage({ type: "close-viewer", screen: 2, timestamp: Date.now() })
      }

      // Request current participant data from any open parent pages, and
      // from screen 1 if this is screen 2
      channel.postMessage({
        type: "request-current",
        screen: SCREEN,
        timestamp: Date.now()
      })

      switchScreensEl.addEventListener("click", switchScreenMode)

      closeViewerEl.addEventListener("click", () => {
        channel.postMessage({ type: "close-viewer", timestamp: Date.now() })
        window.close()
      })

      setupGridKeys()
      setupOtherScreen()

      // Setup keyboard shortcut forwarding to reading page
      setupShortcutForwarding()

      // Restore inspect state from session storage
      if (sessionStorage.getItem(INSPECT_KEY) === "true") {
        setDebugState(true, false)
      }

      updateStatus("Listening for updates...")
    }

    /**
     * Forward keyboard shortcuts to the reading page via BroadcastChannel
     * Allows radiologists to trigger opinion shortcuts from PACS viewer
     */
    const setupShortcutForwarding = () => {
      const forwardKeys = ["n", "d", "t", "r"]

      document.addEventListener("keydown", (e) => {
        // Don't forward with modifier keys
        if (e.ctrlKey || e.altKey || e.metaKey) return

        const key = e.key.toLowerCase()

        // Forward N/D/T/R shortcuts to reading page (works even when zoomed)
        if (forwardKeys.includes(key) && channel) {
          channel.postMessage({
            type: "shortcut",
            key: key,
            timestamp: Date.now()
          })
        }
      })
    }

    // Start
    init()
  </script>
</body>
</html>
